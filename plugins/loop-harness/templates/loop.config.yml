# .loop/config.yml — per-project settings, generated by /loop-init
# Changes to this file are sensitive: they always go through a PR.

project:
  name: my-project
  # Chosen per project at kickoff (ADR). Each entry needs a rule pack:
  # rules/languages/<language>.md and rules/stacks/<stack>.md
  languages: [typescript]         # e.g. python, go, dart
  stacks: [express, mongo, angular]   # e.g. fastapi, flutter, ionic, go-http

ui:
  language: fr          # language of user-facing text
  multilingual: false   # true → i18n mandatory

commands:
  install: npm ci
  lint: npm run lint
  typecheck: npx tsc --noEmit
  test: npm test
  coverage: npm run test:coverage
  build: npm run build
  deadCode: npx knip
  audit: npm audit --audit-level=high

tests:
  coverageReport: coverage/cobertura-coverage.xml   # Cobertura XML, any language
  diffCoverage:
    threshold: 80
    paths: [src/services/**]
  criticalPaths:        # Playwright E2E required only for these
    - login
    - create-sale

security:
  authTransport: bearer   # cookie | bearer (cookie only with a shared registrable domain)

sensitive:
  paths:
    - src/middlewares/auth*
    - src/models/**
    - src/config/**
    - .env*
    - .github/workflows/**
    - .loop/**
    - .claude/**
  breakingApiCheck: true

coreBusiness:
  paths: []
  labels: [core-business]

tickets:
  adapter: github-issues
  pollMinutes: 5

loop:
  maxParallel: 3
  maxReviewIterations: 3
  autoMerge: false          # phase 1: every ticket ends in a PR you merge; true = phase 2, low-risk tickets merge alone
  permissionMode: auto      # auto (classifier) | bypassPermissions (only inside a container)
  model: ""                 # empty = Claude Code default
  budgetUsdPerAgent: 5
  budgetUsdPerTicket: 15
  agentTimeoutMinutes: 45
  modes:
    manual: true
    daemon: false
    window: null          # e.g. "22:00-07:00"

release:
  strategy: batch          # batch | per-merge | manual
  tool: release-please
  releaseType: simple      # release-please type: node | python | dart | simple
  tagPrefix: v             # monorepo: "<package>-v"
  mobile:
    enabled: false
    minSupportedVersion: null   # oldest app version the API must keep serving

deploy:
  waitMinutes: 15
  pollSeconds: 30
  checks:                 # one command per target: exit 0 = healthy, exit 75 = still deploying, other = failed
    vercel: ""
    railway: ""
  hotfix:
    attempts: 1
    timeoutMinutes: 30

notify:
  githubReviewer: your-github-login
  ntfy:
    server: https://ntfy.sh
    topic: change-me-to-a-random-topic
  email:
    smtpUrl: smtps://smtp.gmail.com:465
    to: you@example.com
    smtpUserEnv: LOOP_SMTP_USER       # values read from env, never stored here
    smtpPasswordEnv: LOOP_SMTP_APP_PASSWORD
