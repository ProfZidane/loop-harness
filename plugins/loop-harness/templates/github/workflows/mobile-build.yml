name: mobile-build

# Builds store artifacts for a released tag. Store submission stays a human action.
# versionName = semver from the tag; versionCode / build number = GitHub run number (monotonic, never reused).
# Keep the job matching the stack chosen in the mobile ADR and delete the other.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build app bundle
        env:
          TAG: ${{ github.event.release.tag_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter pub get
          flutter build appbundle --build-name="${TAG#v}" --build-number="$BUILD_NUMBER"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/app/outputs/bundle/release/app-release.aab

  capacitor-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build app bundle
        env:
          TAG: ${{ github.event.release.tag_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        # android/app/build.gradle must read versionName and versionCode from these properties
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android && ./gradlew bundleRelease -PversionName="${TAG#v}" -PversionCode="$BUILD_NUMBER"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" android/app/build/outputs/bundle/release/app-release.aab
