<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f172a">C2: Containers</text>
  <text x="24" y="54" font-size="12" fill="#64748b">&lt;system name&gt; — what runs where and how it talks</text>

  <!-- System boundary -->
  <rect x="190" y="80" width="560" height="300" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="206" y="100" font-size="11" fill="#64748b">System boundary</text>

  <!-- Person -->
  <g transform="translate(70,190)">
    <circle cx="0" cy="-30" r="16" fill="#1e3a8a"/>
    <path d="M-28,18 Q-28,-8 0,-8 Q28,-8 28,18 Z" fill="#1e3a8a"/>
    <text x="0" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Seller</text>
    <text x="0" y="56" text-anchor="middle" font-size="11" fill="#64748b">[Person]</text>
  </g>

  <!-- Web app -->
  <g filter="url(#shadow)">
    <rect x="230" y="140" width="190" height="110" rx="10" fill="#2563eb"/>
  </g>
  <g transform="translate(250,158)" fill="none" stroke="#ffffff" stroke-width="1.6">
    <rect x="0" y="0" width="26" height="20" rx="3"/>
    <line x1="0" y1="6" x2="26" y2="6"/>
  </g>
  <text x="325" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Web app</text>
  <text x="325" y="218" text-anchor="middle" font-size="11" fill="#dbeafe">[Angular, Vercel]</text>
  <text x="325" y="236" text-anchor="middle" font-size="10.5" fill="#dbeafe">UI, client-side state</text>

  <!-- API -->
  <g filter="url(#shadow)">
    <rect x="520" y="140" width="190" height="110" rx="10" fill="#2563eb"/>
  </g>
  <g transform="translate(540,158)" fill="none" stroke="#ffffff" stroke-width="1.6">
    <path d="M4,4 L0,10 L4,16 M22,4 L26,10 L22,16 M16,2 L10,18"/>
  </g>
  <text x="615" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">API</text>
  <text x="615" y="218" text-anchor="middle" font-size="11" fill="#dbeafe">[Express, Railway]</text>
  <text x="615" y="236" text-anchor="middle" font-size="10.5" fill="#dbeafe">Business logic, auth</text>

  <!-- Database -->
  <g transform="translate(615,300)" filter="url(#shadow)">
    <path d="M-60,-14 L-60,34 A60,14 0 0,0 60,34 L60,-14" fill="#0f766e"/>
    <ellipse cx="0" cy="-14" rx="60" ry="14" fill="#14b8a6"/>
  </g>
  <text x="615" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">MongoDB</text>
  <text x="615" y="344" text-anchor="middle" font-size="10.5" fill="#ccfbf1">[Atlas]</text>

  <!-- Third party -->
  <g transform="translate(860,195)" filter="url(#shadow)">
    <path d="M-50,20 Q-62,20 -62,6 Q-62,-8 -48,-9 Q-44,-28 -22,-26 Q-10,-40 8,-30 Q30,-34 34,-12 Q54,-10 52,6 Q52,20 38,20 Z" fill="#64748b"/>
  </g>
  <text x="855" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Stripe</text>
  <text x="855" y="244" text-anchor="middle" font-size="11" fill="#64748b">[External system]</text>

  <!-- Relations -->
  <line x1="102" y1="190" x2="226" y2="192" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="164" y="182" text-anchor="middle" font-size="10.5" fill="#334155">uses, HTTPS</text>

  <line x1="420" y1="195" x2="516" y2="195" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="468" y="186" text-anchor="middle" font-size="10.5" fill="#334155">JSON/HTTPS</text>

  <line x1="615" y1="250" x2="615" y2="282" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="624" y="270" font-size="10.5" fill="#334155">Mongoose</text>

  <line x1="710" y1="195" x2="796" y2="195" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="775" y="214" text-anchor="middle" font-size="10.5" fill="#334155">REST + webhooks</text>
</svg>
