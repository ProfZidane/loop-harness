name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eslint-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/loop-harness/presets/eslint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/loop-harness/presets/eslint/package-lock.json
      - run: npm ci
      - run: npm test

  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/loop-harness/scripts/gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --test ../init/loop-init.test.js ../hooks/guard.test.js ../agents.test.js ../docs/diagram.test.js ../orchestrator/core.test.js ../orchestrator/pipeline.test.js ../orchestrator/usage.test.js

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @anthropic-ai/claude-code plugin validate .

  example-gates:
    uses: ./.github/workflows/gates.yml
    with:
      working-directory: examples/node-api
