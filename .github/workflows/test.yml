name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eslint-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eslint-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/eslint-config/package-lock.json
      - run: npm ci
      - run: npm test

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @anthropic-ai/claude-code plugin validate .

  example-gates:
    uses: ./.github/workflows/gates.yml
    with:
      working-directory: examples/node-api
